[project]
name = "f2f-assessment"
version = "0.1.0"
description = "F2F assessment webapp for new Implementation Managers (in-memory, local)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "truststore>=0.10.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f2f"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length; long literals stay readable.
# RUF001: en dashes in user-facing strings are intentional.
ignore = ["B008", "E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["f2f"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
